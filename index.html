<!DOCTYPE html>

<body>

  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></symbol>
  <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9v6h3l5 4V5L7 9H4Z"/><path d="M16 10l5 4M21 10l-5 4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 5h10l-2 3.5L16 12H6"/></symbol>

  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="M14 6l4 4"/></symbol>

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 17h6M10 20h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3Z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></symbol>

  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3.5" y="6" width="10" height="14" rx="2.5"/><path d="M8 6V5a2 2 0 0 1 2.4-2l7 1.6A2 2 0 0 1 19 7l-2.3 12"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9l4-5Z"/><path d="M3 9h18M9.5 4 7.5 9l4.5 11 4.5-11-2-5"/></symbol>

  <symbol id="i-shape-square" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="3"/></symbol>

  <symbol id="i-shape-flower" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M12 4a3 3 0 0 1 0 5.2M12 20a3 3 0 0 0 0-5.2M4.5 8.5a3 3 0 0 0 4.5 2.6M19.5 15.5a3 3 0 0 1-4.5-2.6M4.5 15.5a3 3 0 0 1 4.5-2.6M19.5 8.5a3 3 0 0 0-4.5 2.6"/></symbol>

</svg>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <button id="btnBack" class="icon-btn hidden" type="button" aria-label="返回游戏画廊">
    <svg class="ico"><use href="#i-back"></use></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-badge"><svg class="ico"><use href="#i-logo"></use></svg></span>
    <span class="brand-text">糖果游戏厅</span>
  </a>

  <div class="topbar-actions">
    <button id="btnTheme" class="icon-btn" type="button" aria-label="切换深浅色主题" aria-pressed="false">
      <svg class="ico ico-sun"><use href="#i-sun"></use></svg>
      <svg class="ico ico-moon"><use href="#i-moon"></use></svg>
    </button>
    <button id="btnSound" class="icon-btn" type="button" aria-label="关闭音效" aria-pressed="true">
      <svg class="ico ico-on"><use href="#i-sound-on"></use></svg>
      <svg class="ico ico-off"><use href="#i-sound-off"></use></svg>
    </button>
  </div>
</header>

<!-- 背景装饰光斑 -->
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main id="view" class="view" tabindex="-1"></main>

<div id="fx" class="fx-layer" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/mine.js"></script>
<script src="js/games/link.js"></script>
<script src="js/games/pair.js"></script>
<script src="js/games/sudoku.js"></script>
<script>App.start();</script>
</body>
</html>
